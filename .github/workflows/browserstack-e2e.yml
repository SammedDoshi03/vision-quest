name: BrowserStack Cloud E2E Pipeline (Build -> APK -> Upload -> Test)

on:
  workflow_dispatch:
    inputs:
      app_custom_id:
        description: 'BrowserStack Custom App ID'
        required: true
        default: 'ResonanceMobileApp'
        type: string
  push:
    tags:
      - 'v*.*.*'
    branches:
      - 'release/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browserstack-e2e:
    name: Build APK & Run BrowserStack Cloud Tests
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME || 'rnstuff_EHn4lO' }}
      BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY || 'Ca9UVoyfkAVgrX9jmgWb' }}
      BROWSERSTACK_LOCAL_URL: 'http://rnstuff_ehn4lo.browserstack.com'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9.12.0

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'pnpm'

      - name: Setup Java Development Kit (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Contracts package
        run: pnpm --filter @internal/contracts build

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v3

      # =====================================================================
      # STEP 1: BUILD & GENERATE NATIVE ANDROID APK
      # =====================================================================
      - name: Generate Android Native Prebuild (Expo CNG)
        run: |
          cd apps/mobile
          npx --yes expo prebuild --platform android --clean --no-install
        env:
          EXPO_NO_TELEMETRY: '1'

      - name: Assemble Android APK
        run: |
          cd apps/mobile/android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon -Dorg.gradle.jvmargs="-Xmx4096m -XX:MaxMetaspaceSize=1024m" || ./gradlew assembleDebug --no-daemon

      - name: Locate Generated APK
        id: locate-apk
        run: |
          mkdir -p build-output/android
          APK_FILE=$(find apps/mobile/android/app/build/outputs/apk -name "*.apk" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            echo "Error: No APK binary found in build outputs!"
            exit 1
          fi
          cp "$APK_FILE" build-output/android/app-release.apk
          echo "APK_PATH=build-output/android/app-release.apk" >> $GITHUB_ENV
          echo "Successfully generated APK at: $APK_FILE"

      # =====================================================================
      # STEP 2: UPLOAD (PASTE) APK TO BROWSERSTACK APP AUTOMATE
      # =====================================================================
      - name: Upload APK to BrowserStack App Automate
        id: upload-browserstack
        run: |
          echo "Uploading $APK_PATH to BrowserStack App Automate..."
          CUSTOM_ID="${{ inputs.app_custom_id || 'ResonanceMobileApp' }}"
          
          UPLOAD_RESPONSE=$(curl -s -u "${BROWSERSTACK_USERNAME}:${BROWSERSTACK_ACCESS_KEY}" \
            -X POST "https://api-cloud.browserstack.com/app-automate/upload" \
            -F "file=@${APK_PATH}" \
            -F "custom_id=${CUSTOM_ID}")
          
          echo "BrowserStack Upload Response: $UPLOAD_RESPONSE"
          
          APP_URL=$(echo "$UPLOAD_RESPONSE" | grep -o '"app_url":"[^"]*' | cut -d'"' -f4)
          
          if [ -z "$APP_URL" ]; then
            echo "Failed to parse app_url from BrowserStack response."
            exit 1
          fi
          
          echo "APP_URL=$APP_URL" >> $GITHUB_ENV
          echo "Successfully uploaded APK! BrowserStack App URL: $APP_URL"

      # =====================================================================
      # STEP 3: EXECUTE AUTOMATED E2E TESTS ON BROWSERSTACK CLOUD MATRIX
      # =====================================================================
      - name: Execute BrowserStack Cloud E2E Test Suite
        run: |
          echo "Testing uploaded binary ($APP_URL) against BrowserStack device matrix..."
          BROWSERSTACK_APP_URL="$APP_URL" pnpm --filter @internal/testing test

      - name: Generate Execution Report & Dashboard Links
        if: always()
        run: |
          echo "### 🚀 BrowserStack App Automate Execution Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Target Application:** \`${{ inputs.app_custom_id || 'ResonanceMobileApp' }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **BrowserStack App URL:** \`${APP_URL}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Target Devices Tested:** iPhone 15 Pro, Samsung Galaxy S24 (Portrait & Landscape), iPad Pro 12.9, Galaxy Tab S9, Google Pixel Fold" >> $GITHUB_STEP_SUMMARY
          echo "- **Live Session Logs & Video Recordings:** [Open BrowserStack App Automate Dashboard](https://app-automate.browserstack.com/dashboard/v2)" >> $GITHUB_STEP_SUMMARY

      - name: Upload Build Artifact for Download
        uses: actions/upload-artifact@v4
        with:
          name: browserstack-tested-apk
          path: build-output/android/*.apk
          retention-days: 14
